#root .min-h-screen .bg-white:not(header):not(nav),#root .min-h-screen .bg-\[\#fff\],#root .min-h-screen .bg-\[\#ffffff\]{background-color:rgba(255,255,255,.78)!important;backdrop-filter:blur(14px) saturate(135%);-webkit-backdrop-filter:blur(14px) saturate(135%);border-color:rgba(255,255,255,.62)!important;box-shadow:0 10px 30px rgba(15,23,42,.07);}
#root .min-h-screen .rounded-xl.border,#root .min-h-screen .rounded-2xl.border{transition:background-color .25s ease,backdrop-filter .25s ease,box-shadow .25s ease;}
html{background:var(--site-theme-bg,#fffaf0);}
@media(prefers-reduced-motion:reduce){#root .min-h-screen{transition:none!important}}
</style>

<style id="admin-studio-visual-upgrade">
/* Admin Studio visual refresh: isolated from storefront layout and existing controls */
.admin-studio-upgraded{background:radial-gradient(ellipse at 95% 0%,rgba(212,175,55,.16),transparent 34%),radial-gradient(ellipse at 0% 35%,rgba(196,30,26,.09),transparent 32%),linear-gradient(155deg,var(--surface,#fff) 0%,#fffaf2 52%,var(--surface,#fff) 100%);border-color:rgba(212,175,55,.38)!important;scrollbar-width:thin;scrollbar-color:#d4af37 transparent}
.admin-studio-upgraded .admin-studio-header{background:linear-gradient(110deg,rgba(15,15,18,.97),rgba(72,25,20,.96),rgba(104,75,15,.95));color:#fff;border-color:rgba(212,175,55,.42)!important;box-shadow:0 8px 24px rgba(15,15,18,.12)}
.admin-studio-upgraded .admin-studio-header h2{letter-spacing:-.025em}
.admin-studio-upgraded section{border-radius:16px!important;background:rgba(255,255,255,.82);border-color:rgba(148,163,184,.28)!important;box-shadow:0 5px 18px rgba(15,23,42,.045);transition:box-shadow .18s ease,border-color .18s ease,transform .18s ease}
.admin-studio-upgraded section:hover{border-color:rgba(212,175,55,.65)!important;box-shadow:0 9px 24px rgba(15,23,42,.075)}
.admin-studio-upgraded button{transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}
.admin-studio-upgraded button:hover{border-color:rgba(196,30,26,.55)}
.admin-studio-upgraded button:active{transform:scale(.985)}
.admin-studio-upgraded input:not([type=checkbox]):not([type=color]),.admin-studio-upgraded textarea,.admin-studio-upgraded select{border-radius:10px;transition:border-color .18s ease,box-shadow .18s ease}
.admin-studio-upgraded input:focus,.admin-studio-upgraded textarea:focus,.admin-studio-upgraded select:focus{outline:none;border-color:#c49a22!important;box-shadow:0 0 0 3px rgba(212,175,55,.17)}
.admin-studio-upgraded input[type=color]{min-height:32px;border-radius:9px;overflow:hidden;cursor:pointer}
.admin-studio-upgraded .sticky{backdrop-filter:blur(14px)}
@media(max-width:640px){.admin-studio-upgraded{background:radial-gradient(ellipse at 100% 0%,rgba(212,175,55,.12),transparent 28%),#fffaf2}.admin-studio-upgraded section{border-radius:13px!important}.admin-studio-upgraded .admin-studio-header{padding:13px}}
@media(prefers-reduced-motion:reduce){.admin-studio-upgraded *{transition:none!important;animation:none!important}}
</style>

<style id="sk-fireworks-glass-ui-v2">
/* SK Fireworks: glass UI, more spacing, accessible Admin Studio controls */
:root{--site-theme-bg:#fffaf0;--site-theme-primary:#c41e1a;--site-theme-gold:#d4af37;--sk-glass-border:rgba(255,255,255,.38)}
html,body{min-height:100%;}
body{background:var(--site-theme-bg,#fffaf0);transition:background-color .25s ease;}
#root{min-height:100vh;background:transparent;}
/* Main site gets a soft festive atmosphere without hiding content */
#root > *{transition:background-color .2s ease;}
/* Admin drawer: stronger contrast so close, back and logout actions stay visible */
.admin-studio-upgraded{background:radial-gradient(ellipse at 92% 0%,rgba(255,215,90,.22),transparent 34%),radial-gradient(ellipse at 0% 30%,rgba(196,30,26,.14),transparent 35%),linear-gradient(145deg,#fffdf7 0%,#f4f0e8 48%,#fff 100%)!important;border-left:1px solid rgba(148,115,37,.42)!important;box-shadow:-24px 0 70px rgba(10,10,15,.28)!important;backdrop-filter:blur(22px);}
.admin-studio-upgraded .admin-studio-header{position:relative;background:linear-gradient(115deg,#111318 0%,#421d1c 56%,#75561a 100%)!important;color:#fff!important;min-height:68px;}
.admin-studio-upgraded .admin-studio-header button{display:inline-flex;align-items:center;justify-content:center;min-width:40px;min-height:40px;border:1px solid rgba(255,255,255,.5)!important;border-radius:12px!important;background:rgba(255,255,255,.16)!important;color:#fff!important;box-shadow:0 4px 14px rgba(0,0,0,.22);}
.admin-studio-upgraded .admin-studio-header button:hover{background:rgba(255,255,255,.28)!important;transform:translateY(-1px);}
/* Admin tabs become separate rectangular glass buttons rather than cramped pills */
.admin-studio-upgraded [role="tablist"]{gap:10px!important;padding:13px 16px!important;background:rgba(255,255,255,.72);backdrop-filter:blur(16px);}
.admin-studio-upgraded [role="tablist"] button{min-height:42px!important;padding:10px 15px!important;border-radius:11px!important;border:1px solid rgba(148,163,184,.35)!important;background:rgba(255,255,255,.72)!important;color:#343434!important;box-shadow:0 3px 10px rgba(15,23,42,.055);}
.admin-studio-upgraded [role="tablist"] button[aria-selected="true"]{background:linear-gradient(135deg,#b91c1c,#e0ad28)!important;border-color:#d4af37!important;color:#fff!important;box-shadow:0 6px 18px rgba(145,64,25,.22)!important;}
.admin-studio-upgraded section{border-radius:14px!important;background:rgba(255,255,255,.76)!important;border:1px solid rgba(148,163,184,.32)!important;box-shadow:0 8px 22px rgba(30,30,40,.055)!important;backdrop-filter:blur(10px);}
.admin-studio-upgraded section:hover{border-color:rgba(212,175,55,.7)!important;box-shadow:0 12px 26px rgba(30,30,40,.09)!important;}
.admin-studio-upgraded button{min-height:34px;transition:transform .16s ease,box-shadow .16s ease,background-color .16s ease,border-color .16s ease;}
.admin-studio-upgraded button:focus-visible{outline:3px solid rgba(196,30,26,.45)!important;outline-offset:2px;}
.admin-studio-upgraded input:not([type=checkbox]):not([type=color]),.admin-studio-upgraded textarea,.admin-studio-upgraded select{min-height:38px;border-radius:10px!important;background:rgba(255,255,255,.92);}
.admin-studio-upgraded label{line-height:1.5;}
.admin-studio-upgraded .admin-studio-header + div{box-shadow:0 1px 0 rgba(0,0,0,.05);}
/* Theme presets are spaced and look like visual swatches */
.admin-studio-upgraded section button.text-left{min-height:48px!important;padding:12px 14px!important;border-radius:12px!important;background:rgba(255,255,255,.78)!important;box-shadow:0 3px 12px rgba(15,23,42,.045);}
.admin-studio-upgraded section button.text-left:hover{transform:translateY(-1px);box-shadow:0 8px 18px rgba(15,23,42,.09)!important;}
/* Global page theme background follows the selected Theme Studio preset */
#root .min-h-screen{background-color:var(--site-theme-bg,#fffaf0);}
@media(max-width:640px){.admin-studio-upgraded [role="tablist"]{gap:8px!important;padding:10px!important}.admin-studio-upgraded [role="tablist"] button{padding:9px 12px!important;min-height:40px!important}.admin-studio-upgraded .admin-studio-header{padding:12px!important}.admin-studio-upgraded .admin-studio-header button{min-width:42px;min-height:42px}}
@media(prefers-reduced-motion:reduce){.admin-studio-upgraded *,#root *{transition:none!important;animation:none!important}}
</style>
